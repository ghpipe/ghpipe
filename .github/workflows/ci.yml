name: ci

on:
  push:
    # Every branch: we merge task branches directly (no pull requests), so a
    # branch push must run the matrix before the merge, not after.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        # -count=1 disables the test cache: a cached pass would hide a real
        # failure on a platform that behaves differently.
        run: go test -count=1 ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: cross compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          mkdir -p dist
          go build -o "dist/ghpipe-${GOOS}-${GOARCH}${suffix}" ./cmd/ghpipe
          ls -l dist
